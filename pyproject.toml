[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlog"
version = "1.0.0"
description = "A fault-tolerant, Kafka-inspired distributed publish-subscribe messaging engine in pure Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Rajath Gadagkar", email = "rajathgadagkar@gmail.com" },
]
keywords = [
    "kafka",
    "pubsub",
    "distributed-systems",
    "message-broker",
    "event-streaming",
    "python",
    "replication",
    "fault-tolerance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
benchmark = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.scripts]
streamlog-coordinator = "streamlog.coordinator.__main__:main"
streamlog-broker = "streamlog.broker.__main__:main"

[tool.setuptools.packages.find]
include = ["streamlog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
